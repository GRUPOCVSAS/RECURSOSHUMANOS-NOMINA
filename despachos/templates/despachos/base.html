<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}App Despachos{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .sidebar { min-height: 100vh; background: #1e293b; }
    .sidebar .nav-link { color: #94a3b8; border-radius: 8px; margin-bottom: 2px; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #334155; color: #f1f5f9; }
    .sidebar .brand { color: #38bdf8; font-weight: 700; font-size: 1.2rem; }
    .main-content { min-height: 100vh; }
    .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); border-radius: 12px; }
    .stat-card { border-left: 4px solid; }
    .badge-estado { font-size: .75rem; padding: .35em .65em; }
  </style>
</head>
<body>
<div class="d-flex">
  <!-- Sidebar -->
  <nav class="sidebar d-flex flex-column p-3" style="width:240px; min-width:240px;">
    <div class="brand mb-4 px-2 pt-2">
      <i class="bi bi-truck me-2"></i>Despachos
    </div>
    <ul class="nav flex-column gap-1">
      <li class="nav-item">
        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
           href="{% url 'despachos:dashboard' %}">
          <i class="bi bi-speedometer2 me-2"></i>Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if 'lista' in request.resolver_match.url_name or 'detalle' in request.resolver_match.url_name or 'crear' == request.resolver_match.url_name or 'editar' == request.resolver_match.url_name %}active{% endif %}"
           href="{% url 'despachos:lista' %}">
          <i class="bi bi-box-seam me-2"></i>Despachos
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if 'transportistas' in request.resolver_match.url_name %}active{% endif %}"
           href="{% url 'despachos:transportistas' %}">
          <i class="bi bi-person-badge me-2"></i>Transportistas
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if 'vehiculos' in request.resolver_match.url_name %}active{% endif %}"
           href="{% url 'despachos:vehiculos' %}">
          <i class="bi bi-truck-front me-2"></i>Vehículos
        </a>
      </li>
    </ul>
    <div class="mt-auto px-2 pb-2">
      <small class="text-muted d-block mb-2">{{ request.user.get_full_name|default:request.user.username }}</small>
      <a href="{% url 'logout' %}" class="nav-link text-danger"><i class="bi bi-box-arrow-right me-2"></i>Salir</a>
    </div>
  </nav>

  <!-- Main -->
  <div class="main-content flex-grow-1 p-4">
    {% if messages %}
      {% for msg in messages %}
        <div class="alert alert-{{ msg.tags }} alert-dismissible fade show" role="alert">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
