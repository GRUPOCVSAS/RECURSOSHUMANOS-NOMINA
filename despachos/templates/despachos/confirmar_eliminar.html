{% extends "despachos/base.html" %}
{% block title %}Eliminar Despacho{% endblock %}
{% block content %}
<div class="d-flex justify-content-center">
  <div class="card" style="max-width:500px; width:100%">
    <div class="card-body text-center py-5">
      <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3"></i>
      <h4>¿Eliminar Despacho {{ despacho.numero }}?</h4>
      <p class="text-muted">Esta acción no se puede deshacer. Se eliminarán también todos los registros de seguimiento.</p>
      <form method="post" class="d-flex gap-3 justify-content-center mt-4">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger px-4">
          <i class="bi bi-trash me-1"></i>Sí, Eliminar
        </button>
        <a href="{% url 'despachos:detalle' despacho.pk %}" class="btn btn-outline-secondary px-4">
          Cancelar
        </a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
