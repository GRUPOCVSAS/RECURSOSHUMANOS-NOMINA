{% extends "despachos/base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fw-bold mb-0">{{ titulo }}</h2>
  <a href="{% url 'despachos:vehiculos' %}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i>Volver
  </a>
</div>
<div class="card" style="max-width:550px">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-sm-6">
          <label class="form-label fw-semibold">Placa *</label>{{ form.placa }}
        </div>
        <div class="col-sm-6">
          <label class="form-label fw-semibold">Capacidad (kg) *</label>{{ form.capacidad_kg }}
        </div>
        <div class="col-sm-6">
          <label class="form-label fw-semibold">Marca *</label>{{ form.marca }}
        </div>
        <div class="col-sm-6">
          <label class="form-label fw-semibold">Modelo *</label>{{ form.modelo }}
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Transportista</label>{{ form.transportista }}
        </div>
        <div class="col-12">
          <div class="form-check">{{ form.activo }} <label class="form-check-label">Activo</label></div>
        </div>
        <div class="col-12 pt-2">
          <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i>Guardar</button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
